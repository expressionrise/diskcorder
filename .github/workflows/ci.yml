name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in src/*.js src/renderer/*.js scripts/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build unpacked app
        run: npx electron-builder --win --dir --publish never
      - name: Smoke test the packaged app
        run: node scripts/smoke-test.js
